name: Publish OpenSCAD Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        id: site
        uses: CameronBrooks11/openscad-web@v0
        with:
          source: drag_chain.scad
          surface: customizer
          mount-path: /

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.site.outputs.site-dir }}
